
name: Build Balu Assistant APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q *.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug
        working-directory: project/BaluAssistantAndroid

      - uses: actions/upload-artifact@v4
        with:
          name: Balu-Assistant-APK
          path: project/BaluAssistantAndroid/app/build/outputs/apk/debug/*.apk
          
